# ld65 config for the shareware intro (c64_client/intro/intro.s).
#
# One PRG at $0801 that must END BELOW $0C00, because $0C00 becomes the
# text screen for the bottom five rows. MAIN's size enforces that: if the
# code outgrows it the link fails rather than quietly eating the screen.
#
# STUBCODE is the chain-loader. Its bytes ship inside the PRG (load =
# MAIN) but every label in it resolves to $0334 (run = STUBMEM), because
# it is copied to the cassette buffer and run from there - the KERNAL
# LOAD it performs overwrites the whole intro image at $0801.
#
# VARS is the intro's handful of variables. $02A7-$02FF is the free tail
# of page 2: always RAM, never touched by the KERNAL's LOAD, and outside
# both the PRG image and every copy destination.

MEMORY {
    LOADADDR: file = %O, start = $07FF,  size = $0002;
    MAIN:     file = %O, start = $0801,  size = $03FF;
    STUBMEM:  file = "",  start = $0334,  size = $00CC;
    VARS:     file = "",  start = $02A7,  size = $0059;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro, optional = yes;
    STUBCODE: load = MAIN,     run  = STUBMEM, type = ro, define = yes;
    VARS:     load = VARS,     type = bss, define = yes;
}
