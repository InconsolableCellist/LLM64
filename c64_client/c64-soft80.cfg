FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    # 1k stack + HIMEM $B000: $B000-$BFFF is the streamed-SID window
    # (sidreloc target page b0), $C000+ holds the soft-80 shadow/matrix.
    # Was $0600; measured peak use is <512 (test-emu-diag), and the
    # freed 512 went to BSS when the Hayes+MODE80 build overflowed
    # (docs/15). If you change this, keep emu/test_e2e.py CAN_START and
    # include/diag.inc in sync.
    __STACKSIZE__: type = weak, value = $0400;
    __HIMEM__:     type = weak, value = $B000;
    # Overlay module slot: a fixed window just below the C stack that
    # disk-loaded modules (mod_*.c, segment OVERLAY1) run in. The linker
    # emits them to a separate %O.1 file with a 2-byte load header, so
    # LOAD"...",8,1 (or cbm_load) drops them exactly here. BSS is capped
    # below the slot; if it overflows, shrink __OVERLAYSIZE__.
    # Was $0E00; 512 went to BSS alongside the stack cut (docs/15).
    # Biggest module (mod_sound) is 2994 B, leaving 78 B of slack.
    __OVERLAYSIZE__:  type = weak,   value = $0C00;
    __OVERLAYSTART__: type = export, value = __HIMEM__ - __STACKSIZE__ - __OVERLAYSIZE__;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __HEADER_LAST__;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __OVERLAYSTART__ - __ONCE_RUN__;
    OVL1ADDR: file = "%O.1",           start = __OVERLAYSTART__ - 2, size = $0002;
    OVL1:     file = "%O.1",           start = __OVERLAYSTART__,     size = __OVERLAYSIZE__;
    # Overlays are alternatives: OVL2 occupies the SAME address range,
    # emitted to its own file (only one module is ever loaded at once)
    OVL2ADDR: file = "%O.2",           start = __OVERLAYSTART__ - 2, size = $0002;
    OVL2:     file = "%O.2",           start = __OVERLAYSTART__,     size = __OVERLAYSIZE__;
    OVL3ADDR: file = "%O.3",           start = __OVERLAYSTART__ - 2, size = $0002;
    OVL3:     file = "%O.3",           start = __OVERLAYSTART__,     size = __OVERLAYSIZE__;
    OVL4ADDR: file = "%O.4",           start = __OVERLAYSTART__ - 2, size = $0002;
    OVL4:     file = "%O.4",           start = __OVERLAYSTART__,     size = __OVERLAYSIZE__;
    OVL5ADDR: file = "%O.5",           start = __OVERLAYSTART__ - 2, size = $0002;
    OVL5:     file = "%O.5",           start = __OVERLAYSTART__,     size = __OVERLAYSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    OVL1ADDR: load = OVL1ADDR, type = ro;
    OVERLAY1: load = OVL1,     type = ro,  define   = yes, optional = yes;
    OVL2ADDR: load = OVL2ADDR, type = ro;
    OVERLAY2: load = OVL2,     type = ro,  define   = yes, optional = yes;
    OVL3ADDR: load = OVL3ADDR, type = ro;
    OVERLAY3: load = OVL3,     type = ro,  define   = yes, optional = yes;
    OVL4ADDR: load = OVL4ADDR, type = ro;
    OVERLAY4: load = OVL4,     type = ro,  define   = yes, optional = yes;
    OVL5ADDR: load = OVL5ADDR, type = ro;
    OVERLAY5: load = OVL5,     type = ro,  define   = yes, optional = yes;
    # Module-private BSS: slot RAM past the loaded code. Not written to
    # the overlay file and NOT zero-initialized - module code must store
    # before it loads (with -Cl, static locals qualify automatically).
    OVL2BSS:  load = OVL2,     type = bss, optional = yes;
    OVL3BSS:  load = OVL3,     type = bss, optional = yes;
    OVL1BSS:  load = OVL1,     type = bss, optional = yes;
    OVL4BSS:  load = OVL4,     type = bss, optional = yes;
    OVL5BSS:  load = OVL5,     type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
